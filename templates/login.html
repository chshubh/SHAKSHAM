{% extends 'base.html' %}{% from '_macros.html' import csrf with context %}
{% block title %}Log in{% endblock %}
{% block content %}
<div class="card form-card">
  <h1>Welcome back</h1>
  <form method="post" novalidate>
    {{ csrf() }}
    <label class="field">Email<input type="email" name="email" value="{{ email or '' }}" autocomplete="email" required></label>
    <label class="field">Password<input type="password" name="password" autocomplete="current-password" required></label>
    <button class="btn btn-primary btn-lg" type="submit" style="width:100%">Log in</button>
  </form>
  <p style="margin-top:1rem">New here? <a href="{{ url_for('register') }}">Create an account</a></p>
</div>
{% endblock %}
